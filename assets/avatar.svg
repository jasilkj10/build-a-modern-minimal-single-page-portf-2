<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d2b" />
      <stop offset="50%" stop-color="#090518" />
      <stop offset="100%" stop-color="#05030f" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05030f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="100%" stop-color="#0b0817" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="140" fill="url(#faceGlow)" filter="url(#softGlow)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="400" x2="400" y2="400" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="90" cy="110" r="45" fill="#9333ea" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="310" cy="220" r="60" fill="#6366f1" opacity="0.16" filter="url(#softGlow)" />

  <!-- Stylized Figure -->
  <!-- Shoulders & Torso -->
  <path d="M 90 480 C 90 380 130 350 200 350 C 270 350 310 380 310 480 Z" fill="url(#jacketGrad)" stroke="#38295c" stroke-width="2" />
  
  <!-- Collar / Neck -->
  <path d="M 175 350 L 175 270 C 175 260 225 260 225 270 L 225 350 Z" fill="#2d224d" />
  <path d="M 160 350 L 200 400 L 240 350" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.7" />

  <!-- Head & Hair -->
  <ellipse cx="200" cy="205" rx="58" ry="72" fill="#241a40" stroke="#48327d" stroke-width="1.5" />
  
  <!-- Modern Hair Contour -->
  <path d="M 140 180 C 135 120 170 100 205 100 C 245 100 265 125 262 175 C 255 150 240 135 210 135 C 170 135 150 160 140 180 Z" fill="#4c1d95" opacity="0.9" />
  <path d="M 150 170 C 150 115 190 105 215 105 C 240 105 255 120 255 150 C 235 140 215 140 185 155 C 165 165 155 170 150 170 Z" fill="#7c3aed" opacity="0.4" />

  <!-- Glasses / Modern Cyber Frame -->
  <g stroke="url(#accentGrad)" stroke-width="2.5" fill="none">
    <!-- Left Lens -->
    <rect x="156" y="188" width="36" height="24" rx="7" fill="#6366f1" fill-opacity="0.12" />
    <!-- Right Lens -->
    <rect x="208" y="188" width="36" height="24" rx="7" fill="#6366f1" fill-opacity="0.12" />
    <!-- Bridge -->
    <line x1="192" y1="198" x2="208" y2="198" />
    <!-- Temples -->
    <line x1="148" y1="197" x2="156" y2="197" />
    <line x1="244" y1="197" x2="252" y2="197" />
  </g>

  <!-- Facial highlights & expression -->
  <circle cx="174" cy="200" r="2.5" fill="#c084fc" />
  <circle cx="226" cy="200" r="2.5" fill="#c084fc" />
  <!-- Confident slight smile -->
  <path d="M 188 238 Q 200 247 212 238" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />

  <!-- Code/AI Hologram Floating Overlay Badges -->
  <g transform="translate(45, 60)">
    <rect width="115" height="34" rx="17" fill="#1e1338" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#22c55e" />
    <text x="32" y="21" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CSE (AI) '28</text>
  </g>

  <g transform="translate(245, 305)">
    <rect width="115" height="34" rx="17" fill="#140e2b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" />
    <text x="18" y="21" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✦ Thrissur, IN</text>
  </g>

  <!-- Outer Glass Frame Ring -->
  <rect x="1.5" y="1.5" width="397" height="477" rx="23" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.35" />
</svg>
